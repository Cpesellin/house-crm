<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- House icon -->
  <g transform="translate(460,80) scale(2.8)">
    <path d="M50 10L90 40H10L50 10Z" fill="url(#house)"/>
    <rect x="22" y="40" width="56" height="50" rx="3" fill="url(#house)"/>
    <rect x="38" y="55" width="24" height="35" rx="3" fill="#0f172a" opacity="0.6"/>
    <rect x="43" y="60" width="14" height="14" rx="2" fill="#fff" opacity="0.3"/>
  </g>
  <!-- Text -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="4">HOUSE</text>
  <text x="600" y="460" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#94a3b8" letter-spacing="6">ASESORES INMOBILIARIOS</text>
  <!-- Tagline -->
  <text x="600" y="540" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#60a5fa" letter-spacing="1">Tu hogar ideal te espera · Pereira, Colombia</text>
  <!-- Bottom accent line -->
  <rect x="450" y="580" width="300" height="3" rx="2" fill="#3b82f6" opacity="0.5"/>
