<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{width:1200px;height:630px;overflow:hidden;font-family:Georgia,serif}
  </style>
</head>
<body>
<div style="width:1200px;height:630px;background:linear-gradient(135deg,#faf9f7,#f0eeeb);position:relative;overflow:hidden">
  <!-- Top accent line -->
  <div style="height:6px;background:linear-gradient(90deg,#122d4f,#1a4f8b)"></div>

  <!-- Decorative circles -->
  <div style="position:absolute;top:-60px;right:-60px;width:400px;height:400px;border-radius:50%;background:#122d4f;opacity:.03"></div>
  <div style="position:absolute;bottom:-40px;left:-40px;width:300px;height:300px;border-radius:50%;background:#1a6b4a;opacity:.04"></div>

  <!-- Logo -->
  <div style="position:absolute;top:50px;left:80px;display:flex;align-items:center;gap:14px">
    <div style="width:48px;height:48px;border-radius:12px;background:#122d4f;display:flex;align-items:center;justify-content:center">
      <img src="img/logo.png" style="width:40px;height:40px" onerror="this.parentElement.innerHTML='<span style=color:#fff;font-size:24px>🏠</span>'">
    </div>
    <span style="font-size:28px;font-weight:700;color:#122d4f;letter-spacing:-0.5px">House</span>
    <span style="margin-left:8px;padding:6px 16px;border-radius:20px;background:#122d4f10;color:#122d4f;font-family:Arial,sans-serif;font-size:14px;font-weight:600">Pereira, Risaralda</span>
  </div>

  <!-- Main title -->
  <div style="position:absolute;top:145px;left:80px">
    <div style="font-size:56px;font-weight:700;color:#122d4f;line-height:1.15">Publica tu inmueble</div>
    <div style="font-size:56px;font-weight:700;color:#1a6b4a;line-height:1.15">gratis.</div>
  </div>

  <!-- Subtitle -->
  <div style="position:absolute;top:290px;left:80px;font-family:Arial,sans-serif;font-size:22px;color:#5a5550;line-height:1.6">
    Verificamos compradores, acompañamos visitas<br>y cerramos el negocio. Tú solo publicas.
  </div>

  <!-- Stats bar -->
  <div style="position:absolute;top:385px;left:80px;right:80px;height:110px;background:#fff;border-radius:18px;border:1.5px solid #e8e5e0;display:flex;align-items:center;justify-content:space-around">
    <div style="text-align:center"><div style="font-size:40px;font-weight:700;color:#122d4f">132</div><div style="font-family:Arial,sans-serif;font-size:14px;color:#5a5550;margin-top:2px">inmuebles activos</div></div>
    <div style="width:1.5px;height:50px;background:#e8e5e0"></div>
    <div style="text-align:center"><div style="font-size:40px;font-weight:700;color:#1a6b4a">3%</div><div style="font-family:Arial,sans-serif;font-size:14px;color:#5a5550;margin-top:2px">comisión en venta</div></div>
    <div style="width:1.5px;height:50px;background:#e8e5e0"></div>
    <div style="text-align:center"><div style="font-size:40px;font-weight:700;color:#1a6b4a">10%</div><div style="font-family:Arial,sans-serif;font-size:14px;color:#5a5550;margin-top:2px">captación arriendo</div></div>
    <div style="width:1.5px;height:50px;background:#e8e5e0"></div>
    <div style="text-align:center"><div style="font-size:40px;font-weight:700;color:#122d4f">$0</div><div style="font-family:Arial,sans-serif;font-size:14px;color:#5a5550;margin-top:2px">costo de publicar</div></div>
  </div>

  <!-- CTA buttons -->
  <div style="position:absolute;top:530px;left:80px;display:flex;gap:14px;align-items:center">
    <div style="padding:16px 36px;border-radius:14px;background:linear-gradient(135deg,#1a6b4a,#22875e);color:#fff;font-family:Arial,sans-serif;font-size:20px;font-weight:700">Publica tu inmueble →</div>
    <div style="padding:16px 32px;border-radius:14px;background:#25D366;color:#fff;font-family:Arial,sans-serif;font-size:20px;font-weight:700">WhatsApp</div>
    <div style="font-family:Arial,sans-serif;font-size:15px;color:#999;margin-left:12px">🔒 Tu información es confidencial</div>
  </div>

  <!-- Bottom accent line -->
  <div style="position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#1a6b4a,#22875e)"></div>
</div>
</body>
</html>
