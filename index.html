  <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
  <!-- Vista previa al compartir la raíz.
       Va aquí, estática, y NO en /api/home, porque en Vercel el sistema de
       archivos gana sobre las reescrituras: existe este index.html, así que
       la regla de user-agent para "/" nunca se aplica. Con /arriendos y
       /ver/:ref sí funciona, porque ahí no hay ningún archivo.
       /api/home queda escrita y probada para cuando el multi-tenant exija
       vista previa por inquilino; entonces hará falta middleware, que sí
       corre antes del sistema de archivos.
       La descripción no lleva conteos: en un archivo estático un "174
       inmuebles" queda viejo y nadie lo nota. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.inmobiliariahouse.com.co/">
  <meta property="og:title" content="Inmobiliaria House · Inmuebles en Pereira y el Eje Cafetero">
  <meta property="og:description" content="Verificamos cada inmueble, filtramos a los interesados y acompañamos cada visita hasta la firma. Oficina en Calle 14 #14-09, Pereira. WhatsApp 310 592 2763.">
  <meta property="og:image" content="https://www.inmobiliariahouse.com.co/img/og-house.jpg">
  <meta property="og:image:secure_url" content="https://www.inmobiliariahouse.com.co/img/og-house.jpg">

  <!-- Aquí había un script que redirigía la raíz a #/portafolio antes de
       que cargara la app. Se elimina: el enrutador ya resuelve la raíz sin
       hash mostrando el home, y esta redirección lo pisaba siempre.

       Dos cosas que enseñó:

       · Estaba en el HTML, no en el JS, así que ningún arreglo del
         enrutador podía tener efecto. Es el mismo patrón de los cuatro
         botones de compartir: arreglar la copia que no se ejecuta.

       · Llevaba `if (location.search) return`, o sea que se desactivaba
         con cualquier parámetro en la URL. Las pruebas con ?v=1 pasaban
         justo porque saltaban esta redirección. Un falso positivo. -->
